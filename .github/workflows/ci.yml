name: C++ CI with GoogleTest + clang-tidy + Codecov

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "project/src/**"
      - "project/tests/**"
      - "project/CMakeLists.txt"
      - "project/cmake/**"
      - ".github/workflows/**"

  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "project/src/**"
      - "project/tests/**"
      - "project/CMakeLists.txt"
      - "project/cmake/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      pull-requests: write
      checks: write

    defaults:
      run:
        shell: bash
        working-directory: ./project

    env:
      BUILD_TYPE: Debug

      # 기본값은 Mock 테스트
      # main으로 PR 날릴 때만 아래 Decide test mode 단계에서 ON으로 바뀜
      USE_REAL_DEVICE: OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Detect ccache
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          else
            echo "USE_CCACHE=0" >> "$GITHUB_ENV"
          fi

      - name: Cache ccache
        if: env.USE_CCACHE == '1'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('project/CMakeLists.txt', 'project/src/**', 'project/tests/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install gcovr
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gcovr

      - name: Clean build directory
        run: |
          rm -rf build

      - name: Decide test mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "USE_REAL_DEVICE=ON" >> "$GITHUB_ENV"
            echo "Test mode: real device objects"
          else
            echo "USE_REAL_DEVICE=OFF" >> "$GITHUB_ENV"
            echo "Test mode: mock objects"
          fi

      - name: Configure
        run: |
          CMAKE_ARGS=(
            -S .
            -B build
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
            -DUSE_REAL_DEVICE=${USE_REAL_DEVICE}
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DCMAKE_C_COMPILER=gcc
            -DCMAKE_CXX_COMPILER=g++
            "-DCMAKE_C_FLAGS=--coverage -O0 -g"
            "-DCMAKE_CXX_FLAGS=--coverage -O0 -g"
          )

          if [ "${USE_CCACHE}" = "1" ]; then
            CMAKE_ARGS+=(
              -DCMAKE_C_COMPILER_LAUNCHER=ccache
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            )
          fi

          cmake "${CMAKE_ARGS[@]}"

      - name: Build
        run: |
          cmake --build build -j"$(nproc)"

      - name: clang-tidy
        if: ${{ !cancelled() }}
        uses: cpp-linter/cpp-linter-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          database: project/build
          style: file
          tidy-checks: ""
          lines-changed-only: false
          thread-comments: true
          ignore: project/build|project/tests|project/build/_deps

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          gcovr \
            --root . \
            --filter 'src/' \
            --exclude 'tests/' \
            --exclude 'build/' \
            --exclude 'src/main.cpp' \
            --xml \
            --output coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./project/coverage.xml
          fail_ci_if_error: true 