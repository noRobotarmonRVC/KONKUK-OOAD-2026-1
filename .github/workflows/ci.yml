name: C++ CI with GoogleTest + clang-tidy + Codecov

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "project/src/**"
      - "project/server/**"
      - "project/tests/**"
      - "project/CMakeLists.txt"
      - "project/cmake/**"
      - ".github/workflows/**"

  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "project/src/**"
      - "project/server/**"
      - "project/tests/**"
      - "project/CMakeLists.txt"
      - "project/cmake/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Debug

jobs:
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash
        working-directory: ./project

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Configure
        run: |
          rm -rf build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DUSE_REAL_DEVICE=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: |
          cmake --build build -j"$(nproc)"

  clang-tidy:
    name: 2. clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    permissions:
      contents: write
      pull-requests: write
      checks: write

    defaults:
      run:
        shell: bash
        working-directory: ./project

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Configure
        run: |
          rm -rf build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DUSE_REAL_DEVICE=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++

      - name: clang-tidy
        uses: cpp-linter/cpp-linter-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          database: project/build
          style: file
          tidy-checks: ""
          lines-changed-only: false
          thread-comments: true
          ignore: project/build|project/tests|project/build/_deps

  mock-test:
    name: 3. Mock Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    defaults:
      run:
        shell: bash
        working-directory: ./project

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Configure
        run: |
          rm -rf build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DUSE_REAL_DEVICE=OFF \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: |
          cmake --build build -j"$(nproc)"

      - name: Run mock tests
        run: |
          ctest --test-dir build --output-on-failure

  real-device-test:
    name: 4. Real Device Tests with TCP Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    defaults:
      run:
        shell: bash
        working-directory: ./project

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ netcat-openbsd

      - name: Configure
        run: |
          rm -rf build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DUSE_REAL_DEVICE=ON \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: |
          cmake --build build -j"$(nproc)"

      - name: Start TCP server
        run: |
          nohup ./build/rvc_server > server.log 2>&1 &
          echo $! > server.pid

          for i in {1..10}; do
            if nc -z 127.0.0.1 9000; then
              echo "TCP server is ready"
              exit 0
            fi
            echo "Waiting for TCP server... ($i/10)"
            sleep 1
          done

          echo "TCP server failed to start"
          cat server.log || true
          exit 1

      - name: Run real-device tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Stop TCP server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

          echo "===== TCP Server Log ====="
          cat server.log || true

  coverage:
    name: 5. Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: mock-test

    defaults:
      run:
        shell: bash
        working-directory: ./project

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gcovr

      - name: Configure with coverage
        run: |
          rm -rf build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUSE_REAL_DEVICE=OFF \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            "-DCMAKE_C_FLAGS=--coverage -O0 -g" \
            "-DCMAKE_CXX_FLAGS=--coverage -O0 -g"

      - name: Build
        run: |
          cmake --build build -j"$(nproc)"

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          gcovr \
            --root . \
            --filter 'src/' \
            --exclude 'tests/' \
            --exclude 'build/' \
            --exclude 'src/main.cpp' \
            --xml \
            --output coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./project/coverage.xml
          fail_ci_if_error: true